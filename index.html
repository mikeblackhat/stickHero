<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stick Hero - Modo Navideño</title>
    <!-- Pixel Font (Press Start 2P) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="christmas-mode">
    <div class="top-bar">
        <button id="leaderboard-btn" class="control-btn" type="button" aria-label="Ver tabla de récords" title="Récords">
            <svg class="control-svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M6 9H4.5a2.5 2.5 0 0 1 0-5H6"></path>
                <path d="M18 9h1.5a2.5 2.5 0 0 0 0-5H18"></path>
                <path d="M4 22h16"></path>
                <path d="M10 14.66V17c0 .55-.45 1-1 1H7v4h10v-4h-2c-.55 0-1-.45-1-1v-2.34"></path>
                <path d="M6 4h12v7a6 6 0 0 1-12 0V4z"></path>
            </svg>
            <span>RÉCORDS</span>
        </button>

        <button id="sound-toggle" class="control-btn sound-btn" type="button" aria-label="Activar o desactivar sonido" title="Sonido">
            <svg id="sound-on-svg" class="control-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg id="sound-off-svg" class="control-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <line x1="23" y1="9" x2="17" y2="15"></line>
                <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
        </button>

        <button id="theme-toggle" class="control-btn" type="button" aria-label="Cambiar modo de juego">
            <span id="theme-icon-container">
                <svg class="control-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="2" x2="12" y2="22"></line>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
                    <line x1="19.07" y1="4.93" x2="4.93" y2="19.07"></line>
                    <circle cx="12" cy="12" r="2.5" fill="currentColor"></circle>
                </svg>
            </span>
            <span id="theme-text">MODO NAVIDEÑO</span>
        </button>
    </div>

    <!-- Score & Timer HUD -->
    <div class="score-container">
        <div id="score">0</div>
        <div id="high-score">RÉCORD: 0</div>

        <!-- Live 60-Second Challenge Timer -->
        <div class="timer-container" id="timer-container">
            <div class="timer-label-row">
                <svg class="timer-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <span id="timer-val">60.0s</span>
            </div>
            <div class="timer-bar-track">
                <div class="timer-bar" id="timer-bar"></div>
            </div>
        </div>
    </div>

    <div class="container">
        <canvas id="game"></canvas>
        <div id="introduction" class="instruction-badge">MANTÉN PRESIONADO PARA ESTIRAR</div>
        <div id="perfect" class="perfect-badge">¡DOBLE PUNTUACIÓN!</div>

        <!-- Game Over Modal Card -->
        <div id="game-over-modal" class="game-over-modal">
            <div id="modal-title" class="modal-title">FIN DE PARTIDA</div>
            <div class="modal-scores">
                <div class="modal-score-item">
                    <span class="modal-label">PUNTOS</span>
                    <span id="modal-score-val" class="modal-val">0</span>
                </div>
                <div class="modal-score-divider"></div>
                <div class="modal-score-item">
                    <span class="modal-label">TIEMPO</span>
                    <span id="modal-time-val" class="modal-val">00:00</span>
                </div>
                <div class="modal-score-divider"></div>
                <div class="modal-score-item">
                    <span class="modal-label">RÉCORD</span>
                    <span id="modal-best-val" class="modal-val">0</span>
                </div>
            </div>

            <!-- Player Name Entry -->
            <div class="name-entry-box" id="name-entry-box">
                <label for="player-name-input" class="modal-sublabel">REGISTRA TU RÉCORD:</label>
                <div class="input-row">
                    <input type="text" id="player-name-input" maxlength="10" placeholder="NOMBRE" class="pixel-input" autocomplete="off" spellcheck="false">
                    <button id="save-score-btn" type="button" class="pixel-save-btn">GUARDAR</button>
                </div>
            </div>

            <!-- Top 5 Rankings inside modal -->
            <div class="leaderboard-preview-box">
                <div class="lb-section-title">TOP JUGADORES</div>
                <div id="leaderboard-list" class="leaderboard-table"></div>
            </div>

            <button id="restart" type="button" aria-label="Reintentar partida">
                <svg class="restart-svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12a9 9 0 0 1 15-6.7L21 8"></path>
                    <path d="M21 3v5h-5"></path>
                    <path d="M21 12a9 9 0 0 1-15 6.7L3 16"></path>
                    <path d="M3 21v-5h5"></path>
                </svg>
                <span>REINTENTAR</span>
            </button>
        </div>

        <!-- Standalone Full Leaderboard Modal -->
        <div id="leaderboard-modal" class="standalone-modal" style="display: none;">
            <div class="modal-card">
                <div class="modal-header">
                    <div class="modal-title">TABLA DE CLASIFICACIÓN</div>
                    <button id="close-leaderboard-btn" type="button" class="close-btn" aria-label="Cerrar">✕</button>
                </div>
                <div id="standalone-leaderboard-list" class="leaderboard-table"></div>
            </div>
        </div>
    </div>

    <!-- Modular Game Scripts -->
    <script src="js/config.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/renderer.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
